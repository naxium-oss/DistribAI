apiVersion: v1
kind: Service
metadata:
  name: {{ include "distribai.fullname" . }}-orchestrator
  labels:
    app.kubernetes.io/name: distribai
    app.kubernetes.io/component: orchestrator
spec:
  selector:
    app.kubernetes.io/name: distribai
    app.kubernetes.io/component: orchestrator
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
