<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistribAI | Job</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="/shared/icons.css">

    <link rel="stylesheet" href="/shared/components.css">
    <style>
        :root {
            --node-ink: var(--surface-0);
            --node-panel: var(--surface-1);
            --node-raised: var(--surface-2);
            --node-teal: var(--signal);
        }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background:
                radial-gradient(ellipse 70% 45% at 12% -10%, rgba(20, 184, 166, 0.1), transparent 55%),
                var(--node-ink, var(--bg));
        }
        .job-shell { max-width: 820px; margin: 0 auto; padding: 32px 0 48px; }
        .job-hero {
            background: linear-gradient(145deg, var(--node-panel), var(--node-raised));
            border: 1px solid rgba(20, 184, 166, 0.18);
            border-radius: 18px; padding: 24px; margin-bottom: 20px;
            animation: nodeFadeIn 0.4s ease-out;
        }
        .job-hero h1 { margin: 12px 0 6px; font-size: 1.65rem; letter-spacing: -0.02em; }
        .job-detail-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            background: var(--node-panel);
            margin-bottom: 20px;
            animation: nodeFadeIn 0.5s ease-out;
        }
        .job-detail-row { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 12px; font-size: 0.9rem; }
        .job-detail-row dt { color: var(--text-muted); min-width: 120px; }
        .job-detail-row dd { margin: 0; font-family: 'IBM Plex Mono', monospace; }
        .blocker-list { margin: 8px 0 0; padding-left: 18px; color: var(--warning); font-size: 0.85rem; }
        @keyframes nodeFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-active-page="jobs">
    <header data-cai-node-header></header>
    <script src="/shared/node-header.js"></script>
    <main role="main" aria-label="Job detail">
        <div class="container job-shell">
            <section class="job-hero">
                <a href="/jobs.html" class="btn">&larr; Back to jobs</a>
                <h1>Job detail</h1>
                <p id="jobSubtitle" style="color: var(--text-muted); margin: 0;">Loading…</p>
            </section>
            <div id="jobError" class="job-detail-card" style="display:none;color:var(--error);"></div>
            <div id="jobDetail" class="job-detail-card" style="display:none;">
                <dl id="jobFields"></dl>
                <div id="jobBlockersWrap" style="display:none;">
                    <strong>Why waiting</strong>
                    <ul id="jobBlockers" class="blocker-list"></ul>
                </div>
            </div>
        </div>
    </main>
    <script src="/shared/scripts.js"></script>
    <script>
        function jobIdFromQuery() {
            var params = new URLSearchParams(window.location.search);
            return params.get('id') || '';
        }

        function renderBlockers(job) {
            var wrap = document.getElementById('jobBlockersWrap');
            var list = document.getElementById('jobBlockers');
            if (!wrap || !list) return;
            var blockers = job.queue_blockers || [];
            if (!blockers.length) {
                wrap.style.display = 'none';
                return;
            }
            wrap.style.display = 'block';
            list.innerHTML = blockers.map(function(b) {
                var msg = b.message || b.code || 'blocked';
                return '<li>' + escapeHtml(msg) + '</li>';
            }).join('');
        }

        function renderJob(job) {
            var fields = document.getElementById('jobFields');
            var detail = document.getElementById('jobDetail');
            var err = document.getElementById('jobError');
            var sub = document.getElementById('jobSubtitle');
            if (!fields || !detail) return;
            err.style.display = 'none';
            detail.style.display = 'block';
            var jid = job.job_id || job.id || '';
            sub.textContent = jid;
            var rows = [
                ['Status', job.status || '—'],
                ['Model', job.model_name || '—'],
                ['Progress', (Number(job.progress_pct || job.progress) || 0).toFixed(1) + '%'],
                ['Priority', job.priority || job.priority_tier || '—'],
                ['Task', job.latest_task_id || job.task_id || '—'],
                ['Created', job.created_ts ? new Date(job.created_ts).toLocaleString() : '—']
            ];
            fields.innerHTML = rows.map(function(pair) {
                return '<div class="job-detail-row"><dt>' + escapeHtml(pair[0]) +
                    '</dt><dd>' + escapeHtml(String(pair[1])) + '</dd></div>';
            }).join('');
            renderBlockers(job);
        }

        function loadJob() {
            var id = jobIdFromQuery();
            var err = document.getElementById('jobError');
            var detail = document.getElementById('jobDetail');
            var sub = document.getElementById('jobSubtitle');
            if (!id) {
                err.textContent = 'Missing job id in URL (?id=…)';
                err.style.display = 'block';
                detail.style.display = 'none';
                if (sub) sub.textContent = '';
                return;
            }
            if (sub) sub.textContent = id;
            fetch('/api/jobs/' + encodeURIComponent(id))
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(renderJob)
                .catch(function(e) {
                    detail.style.display = 'none';
                    if (sub) sub.textContent = id;
                    err.textContent = 'Could not load job: ' + (e.message || e);
                    err.style.display = 'block';
                });
        }

        document.addEventListener('DOMContentLoaded', loadJob);
    </script>
</body>
</html>
