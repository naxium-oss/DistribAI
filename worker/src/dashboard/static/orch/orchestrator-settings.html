<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistribAI Orchestrator | Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="/shared/icons.css">

    <link rel="stylesheet" href="/shared/components.css">
    <style>
        :root {
            --orch-ink: var(--surface-0);
            --orch-panel: var(--surface-1);
            --orch-raised: var(--surface-2);
            --orch-teal: var(--signal);
        }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background:
                radial-gradient(circle at 30% 0%, rgba(20, 184, 166, 0.1), transparent 42%),
                var(--orch-ink, var(--bg));
        }
        .settings-shell { max-width: 800px; margin: 0 auto; padding: 32px 0 48px; }
        .settings-hero {
            text-align: left;
            margin-bottom: 28px;
            padding: 32px 28px;
            background: linear-gradient(145deg, var(--orch-panel), var(--orch-raised));
            border-radius: 18px;
            border: 1px solid rgba(20, 184, 166, 0.16);
            animation: settingsIn 0.4s ease-out;
        }
        .settings-hero h1 {
            font-size: 1.85rem;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.02em;
        }
        .settings-hero p { color: var(--text-muted); margin: 0; }
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .field-label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .field-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--orch-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 0.95rem;
        }
        .field-control:focus {
            outline: none;
            border-color: var(--orch-teal);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .toggle-row strong { display: block; font-weight: 600; }
        .toggle-row .hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        @keyframes settingsIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-card { animation: settingsIn 0.45s ease-out 0.06s both; }
    </style>
</head>
<body data-active-page="settings">
    <header data-cai-orch-header></header>
    <script src="/shared/orch-header.js"></script>

    <main role="main" aria-label="Orchestrator settings">
        <div class="container settings-shell">
            <header class="settings-hero orch-header">
                <h1>Orchestrator controls</h1>
                <p>Mesh defaults, display name, and Sybil switch</p>
            </header>

            <section class="card settings-card">
                <div class="settings-form">
                    <div>
                        <label class="field-label" for="orchName">Orchestrator display name</label>
                        <input type="text" id="orchName" class="field-control" value="Main DistribAI Orchestrator">
                    </div>
                    <div>
                        <label class="field-label">Organization ID</label>
                        <div id="orchOrgId" class="field-control" style="font-family:'IBM Plex Mono',monospace;font-size:0.85rem;">—</div>
                    </div>
                    <div>
                        <label class="field-label" for="defaultPriority">Default job priority</label>
                        <select id="defaultPriority" class="field-control">
                            <option value="low">Low</option>
                            <option value="normal" selected>Normal</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="toggle-row">
                        <div>
                            <strong>Sybil detection</strong>
                            <div class="hint">Flag anomalous node patterns automatically</div>
                        </div>
                        <div class="toggle">
                            <input type="checkbox" checked>
                            <div class="toggle-track"><div class="toggle-thumb"></div></div>
                        </div>
                    </div>
                    <button class="btn btn-primary" type="button" onclick="showToast('Settings saved successfully', 'success')">Persist configuration</button>
                </div>
            </section>
        </div>
    </main>

    <script src="/shared/scripts.js"></script>
    <script src="/shared/operator-banner.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetchOrgId().then(function (orgId) {
                var el = document.getElementById('orchOrgId');
                if (el) el.textContent = orgId;
            });
        });
    </script>
</body>
</html>
