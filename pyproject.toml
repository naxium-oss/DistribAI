# DistribAI root project configuration.
#
# The PRIMARY codebase is the native C++ port under tools/cpp_port (build with
# make / tools/cpp_port/Makefile; no Python packaging involved).
#
# The Python-era stack (services_python, worker, client, tests, scripts, ...)
# is FROZEN under legacy/ and keeps its own packaging at legacy/pyproject.toml.
# Python-side lint/test/typecheck for that stack runs from legacy/ (see the
# Makefile legacy-* targets).
#
# This file intentionally has no [project] table: nothing at the repo root is
# pip-installable anymore.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "legacy",
    "node_modules",
    "build",
    "runtime",
    ".venv",
    "test-results",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells are executed in order, so an import after a variable and the
# same import again in a later cell are both normal there.
"*.ipynb" = ["E402", "F811"]
