apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distribai.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: distribai
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: distribai
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distribai
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.worker }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "worker.src.daemon.run"]
          env:
            - name: ORCH_GRPC_HOST
              value: {{ include "distribai.fullname" . }}-orchestrator
            - name: GRPC_PORT
              value: "{{ .Values.service.grpcPort }}"
          envFrom:
            - secretRef:
                name: {{ include "distribai.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
