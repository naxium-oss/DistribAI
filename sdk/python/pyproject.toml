[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distribai"
version = "0.1.0"
description = "Python SDK for DistribAI Distributed Compute Network"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "EnderchefCoder", email = "contact@distribai.io"},
]
keywords = ["distributed-compute", "machine-learning", "training", "ai", "slm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/naxium-oss/DistribAI"
Documentation = "https://docs.distribai.io"
Repository = "https://github.com/naxium-oss/DistribAI"
Issues = "https://github.com/naxium-oss/DistribAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["distribai"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
